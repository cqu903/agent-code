[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-code"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "black>=26.5.1",
    "html2text>=2025.4.15",
    "httpx[socks]>=0.28.1",
    "pathspec>=1.1.1",
    "prompt-toolkit>=3.0.52",
    "pytest>=8.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.26.3",
]

[project.scripts]
agent-code = "agent_code.cli:main"

[tool.black]
target-version = ["py312"]

[tool.pyright]
# uv 把依赖装在项目级 .venv,告诉 Pyright 用它解析 import
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["agent_code"]

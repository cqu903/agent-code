[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-code"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "httpx[socks]>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.26.3",
]

[project.scripts]
agent-code = "agent_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_code"]
